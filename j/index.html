<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Count Down Together invite links: /j/#<iCloud share token>. With the
       app installed iOS opens it directly (/j/* in apple-app-site-association)
       and this page never shows. The token is after "#", so it never reaches
       the server. -->
  <meta name="apple-itunes-app" content="app-id=6761277550">
  <title>Simple Count</title>
  <meta property="og:site_name" content="Simple Count">
  <meta property="og:title" content="Count down together on Simple Count">
  <meta property="og:description" content="You're invited to a shared countdown. Every change shows up for everyone.">
  <meta property="og:image" content="https://simplecountdownapp.github.io/icon.png">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Count down together on Simple Count">
  <meta name="twitter:description" content="You're invited to a shared countdown. Every change shows up for everyone.">
  <meta name="twitter:image" content="https://simplecountdownapp.github.io/icon.png">
  <style>
    body { font-family: -apple-system, sans-serif; display: flex; align-items: center;
           justify-content: center; min-height: 100vh; margin: 0; background: #f2f2f7; }
    .card { text-align: center; padding: 40px 32px; background: white; margin: 16px;
            border-radius: 20px; box-shadow: 0 4px 24px rgba(0,0,0,0.08); max-width: 340px; }
    img { width: 80px; height: 80px; border-radius: 18px; margin-bottom: 20px; }
    h1 { font-size: 22px; font-weight: 700; margin: 0 0 8px; color: #1c1c1e; }
    p  { font-size: 15px; color: #6e6e73; margin: 0 0 24px; line-height: 1.5; }
    a  { display: block; padding: 14px 28px; border-radius: 14px; text-decoration: none;
         font-size: 16px; font-weight: 600; }
    #get  { background: #007aff; color: white; margin-bottom: 12px; }
    #join { background: #e5e5ea; color: #007aff; }
    @media (prefers-color-scheme: dark) {
      body { background: #000; } .card { background: #1c1c1e; box-shadow: none; }
      h1 { color: #fff; } p { color: #98989d; } #join { background: #2c2c2e; color: #0a84ff; }
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="/icon.png" alt="Simple Count">
    <h1 id="title">Count down together</h1>
    <p id="pitch">You're invited to a shared countdown. Get Simple Count, then tap Join.</p>
    <a id="get" href="https://apps.apple.com/app/id6761277550">Get Simple Count</a>
    <a id="join" href="#">Join</a>
  </div>
  <script>
    // "Join" hands the invite to iCloud, which opens Simple Count (once
    // installed) and joins the countdown.
    var token = (window.location.hash || "").slice(1);
    var join = document.getElementById("join");
    if (/^[A-Za-z0-9_-]{1,64}$/.test(token)) {
      join.href = "https://www.icloud.com/share/" + token;
    } else {
      join.style.display = "none";
    }
    var T = {
      de: { h: "Gemeinsam runterzählen", p: "Du bist zu einem gemeinsamen Countdown eingeladen. Lade Simple Count und tippe dann auf „Beitreten“.", g: "Simple Count laden", j: "Beitreten" },
      nl: { h: "Samen aftellen", p: "Je bent uitgenodigd voor een gedeelde afteller. Download Simple Count en tik dan op Meedoen.", g: "Download Simple Count", j: "Meedoen" },
      fr: { h: "Comptons les jours ensemble", p: "Vous êtes invité à un compte à rebours partagé. Téléchargez Simple Count, puis touchez Rejoindre.", g: "Télécharger Simple Count", j: "Rejoindre" },
      es: { h: "Cuenten los días juntos", p: "Te invitaron a una cuenta regresiva compartida. Descarga Simple Count y luego toca Unirme.", g: "Descargar Simple Count", j: "Unirme" },
      it: { h: "Contiamo i giorni insieme", p: "Sei invitato a un conto alla rovescia condiviso. Scarica Simple Count, poi tocca Partecipa.", g: "Scarica Simple Count", j: "Partecipa" },
      pt: { h: "Contem os dias juntos", p: "Você foi convidado para uma contagem compartilhada. Baixe o Simple Count e toque em Participar.", g: "Baixar o Simple Count", j: "Participar" },
      ru: { h: "Считаем дни вместе", p: "Вас пригласили в общий отсчёт. Скачайте Simple Count и нажмите «Присоединиться».", g: "Скачать Simple Count", j: "Присоединиться" },
      tr: { h: "Birlikte geri say", p: "Ortak bir geri sayıma davet edildin. Simple Count'u indir, sonra Katıl'a dokun.", g: "Simple Count'u İndir", j: "Katıl" },
      ja: { h: "一緒にカウントダウン", p: "共有カウントダウンに招待されています。Simple Count を入手して「参加」をタップしてください。", g: "Simple Count を入手", j: "参加" },
      ko: { h: "함께 카운트다운", p: "공유 카운트다운에 초대받았어요. Simple Count를 받은 뒤 ‘참여’를 탭하세요.", g: "Simple Count 받기", j: "참여" },
      zh: { h: "一起倒计时", p: "你被邀请加入一个共享倒计时。先获取 Simple Count，再轻点“加入”。", g: "获取 Simple Count", j: "加入" }
    };
    var lang = (navigator.language || "en").toLowerCase().split("-")[0];
    if (T[lang]) {
      document.documentElement.lang = lang;
      document.getElementById("title").textContent = T[lang].h;
      document.getElementById("pitch").textContent = T[lang].p;
      document.getElementById("get").textContent = T[lang].g;
      join.textContent = T[lang].j;
    }
  </script>
</body>
</html>
